<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070409">
<title>Rockstar Life</title>
<style>
/* ================= ROCKSTAR LIFE - noir luxe theme ================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#070409;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#f4eef7; touch-action:manipulation; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
}
#stage{
  position:relative; max-width:480px; margin:0 auto; min-height:100dvh;
  background:
    radial-gradient(90% 50% at 50% -8%, rgba(255,45,120,.13) 0%, rgba(255,45,120,0) 60%),
    radial-gradient(70% 40% at 88% 108%, rgba(123,47,247,.10) 0%, rgba(123,47,247,0) 60%),
    linear-gradient(180deg,#0d0816 0%,#070409 100%);
  overflow:hidden;
}
#shakeWrap{min-height:100dvh; display:flex; flex-direction:column;}
#shakeWrap.shaking{animation:shk .45s}
@keyframes shk{
  0%,100%{transform:translate(0,0)} 15%{transform:translate(-10px,4px) rotate(-.6deg)}
  30%{transform:translate(9px,-5px) rotate(.6deg)} 45%{transform:translate(-7px,-3px)}
  60%{transform:translate(6px,4px)} 75%{transform:translate(-4px,2px)}
}
.screen{display:flex; flex-direction:column; align-items:center; padding:18px 16px 30px; width:100%}
.hidden{display:none !important}

/* ---------- Title screen ---------- */
#scr-title{justify-content:center; min-height:100dvh; text-align:center}
.logo{
  font-size:50px; font-weight:900; letter-spacing:3px; line-height:1.05; margin:10px 0 6px;
  background:linear-gradient(180deg,#fdf6dd 5%,#f5c86e 42%,#c98a2e 78%,#9a641f 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 14px rgba(245,200,110,.28));
}
.logo-sub{font-size:13px; color:#a89bb8; letter-spacing:6px; margin-bottom:28px; text-transform:uppercase}
.stage-lights{display:flex; gap:14px; font-size:28px; margin-bottom:10px; animation:bob 2.4s ease-in-out infinite; opacity:.9}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.best-line{margin-top:18px; color:#f5c86e; font-weight:700; font-size:14px; letter-spacing:1px}
.title-foot{margin-top:26px; font-size:12px; color:#6f6280}

/* ---------- Buttons ---------- */
.btn{
  display:block; width:100%; margin:8px 0; padding:14px; border-radius:14px;
  font-size:16px; font-weight:700; color:#fff; cursor:pointer;
  background:linear-gradient(180deg,#3a1b4f,#241031);
  border:1px solid rgba(255,45,120,.35);
  box-shadow:0 3px 14px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10);
  transition:transform .06s;
}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,#5c4013,#38270c); border-color:rgba(245,200,110,.5);
  box-shadow:0 3px 14px rgba(0,0,0,.55), 0 0 14px rgba(245,200,110,.18), inset 0 1px 0 rgba(255,255,255,.10)}
.btn.cyan{background:linear-gradient(180deg,#123f58,#0b2739); border-color:rgba(0,197,255,.4);
  box-shadow:0 3px 14px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10)}
.btn.green{background:linear-gradient(180deg,#144a2c,#0c2f1d); border-color:rgba(60,220,130,.35);
  box-shadow:0 3px 14px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10)}
.btn.red{background:linear-gradient(180deg,#57131f,#360c13); border-color:rgba(255,90,90,.4);
  box-shadow:0 3px 14px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10)}
.btn.ghost{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14); box-shadow:none}
.btn.small{padding:10px; font-size:14px; border-radius:12px}
.btn.locked{opacity:.42; filter:grayscale(.85); border-color:rgba(255,255,255,.08)}
.btn .sub{display:block; font-size:12px; font-weight:500; opacity:.7; margin-top:2px}
#ageBtn{
  font-size:21px; font-weight:800; letter-spacing:3px; padding:17px; margin:12px 0 4px; border-radius:16px;
  background:linear-gradient(180deg,#e0266c,#a30f4b); color:#fff;
  border:1px solid rgba(245,200,110,.55);
  box-shadow:0 0 26px rgba(255,45,120,.35), inset 0 1px 0 rgba(255,255,255,.25);
  animation:pulseAge 1.6s ease-in-out infinite;
}
@keyframes pulseAge{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
#ageBtn:active{transform:scale(.96)}

/* ---------- HUD ---------- */
#hudTop{display:flex; gap:12px; width:100%; align-items:center;
  background:rgba(20,13,30,.72); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.09); border-radius:16px; padding:10px 12px; margin-bottom:10px}
#avatar{width:92px; height:92px; border-radius:50%; border:2px solid rgba(255,45,120,.75);
  box-shadow:0 0 14px rgba(255,45,120,.35); background:#1a0f26}
#hudName{font-size:19px; font-weight:800; letter-spacing:.5px}
#hudMeta{font-size:13px; color:#b9a8c9; margin-top:2px}
#hudTier{display:inline-block; margin-top:6px; font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
  color:#f7e3b0; background:linear-gradient(180deg,rgba(245,200,110,.22),rgba(245,200,110,.10));
  border:1px solid rgba(245,200,110,.55); padding:4px 12px; border-radius:20px}
#stats{width:100%; background:rgba(20,13,30,.72); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.09); border-radius:16px; padding:10px 12px}
.stat{margin:8px 0; position:relative}
.slabel{display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin-bottom:4px;
  text-transform:uppercase; letter-spacing:1.5px; color:#c9b8d9}
.slabel b{font-size:14px; color:#fff; letter-spacing:0}
.bar{height:9px; background:rgba(255,255,255,.08); border-radius:6px; overflow:hidden}
.fill{height:100%; border-radius:6px; width:50%; transition:width .5s ease;
  background:linear-gradient(90deg,#00b8d4,#7b2ff7,#ff2d78);
  box-shadow:0 0 8px rgba(255,45,120,.35)}
.fill.warn{background:linear-gradient(90deg,#e8a33d,#ff2d78); box-shadow:0 0 8px rgba(232,163,61,.35)}
.fill.bad{background:linear-gradient(90deg,#d43a3a,#8f1d1d); animation:blink 1s infinite; box-shadow:none}
@keyframes blink{50%{opacity:.55}}
#moneyRow{display:flex; justify-content:space-between; align-items:center; margin-top:10px;
  font-size:19px; font-weight:800; color:#f5c86e; letter-spacing:.5px}
#moneyRow span:first-child{font-size:12px; letter-spacing:2px; color:#a89bb8; text-transform:uppercase}
#menuGrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; margin-top:12px}
.menu-btn{padding:15px 8px; border-radius:16px; font-size:14px; font-weight:700; color:#f4eef7; cursor:pointer;
  background:rgba(22,14,34,.72); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.10);
  box-shadow:0 3px 12px rgba(0,0,0,.45)}
.menu-btn:active{transform:scale(.95); border-color:rgba(255,45,120,.55)}
.menu-btn .ic{font-size:24px; display:block; margin-bottom:5px}

/* ---------- Menu overlay ---------- */
#menuOverlay{position:fixed; inset:0; z-index:40; display:flex; align-items:flex-end; justify-content:center;
  background:rgba(5,2,10,.72); backdrop-filter:blur(4px)}
#menuPanel{width:100%; max-width:480px; max-height:88dvh; overflow-y:auto;
  background:linear-gradient(180deg,rgba(26,16,40,.98),rgba(12,7,20,.98));
  border-radius:22px 22px 0 0; border-top:1px solid rgba(255,45,120,.45); padding:16px 16px 30px; animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(60px); opacity:0}}
.menu-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}
.menu-head h2{margin:0; font-size:20px; font-weight:800; letter-spacing:1px}
.xbtn{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:#fff; font-size:16px; font-weight:800;
  width:36px; height:36px; border-radius:50%; cursor:pointer}
.kv{font-size:13px; color:#c9b8d9; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
  border-radius:12px; padding:9px 11px; margin:6px 0}

/* ---------- Modal (events) ---------- */
#modalOverlay{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  background:rgba(5,2,10,.74); padding:18px}
#modal{width:100%; max-width:440px; max-height:88dvh; overflow-y:auto; border-radius:20px; padding:22px 18px;
  background:linear-gradient(180deg,rgba(32,19,48,.98),rgba(15,8,25,.98));
  border:1px solid rgba(245,200,110,.35);
  box-shadow:0 12px 48px rgba(0,0,0,.7), 0 0 30px rgba(255,45,120,.12); animation:pop .25s ease}
@keyframes pop{from{transform:scale(.88); opacity:0}}
#modal h2{margin:0 0 8px; font-size:21px; font-weight:800; letter-spacing:1px; text-align:center}
#modal .mtext{font-size:15px; line-height:1.55; color:#d9cbe8; margin-bottom:12px; text-align:center}
#modal .mresult{font-size:15px; line-height:1.55; color:#fff; background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.10); border-radius:14px; padding:12px; margin-bottom:12px; text-align:center}

/* ---------- Banner / toasts / floaters / confetti ---------- */
#banner{position:fixed; top:0; left:0; right:0; z-index:60; text-align:center; padding:14px 10px;
  background:linear-gradient(90deg,#2b0a18,#7a1440,#2b0a18);
  border-bottom:1px solid rgba(245,200,110,.5);
  font-weight:800; font-size:19px; letter-spacing:2px; color:#f7e3b0;
  text-shadow:0 2px 8px rgba(0,0,0,.6); animation:bannerIn .4s ease; box-shadow:0 4px 24px rgba(0,0,0,.6)}
#banner .bsub{font-size:12px; font-weight:600; display:block; letter-spacing:3px; color:#d9a7c0; margin-top:2px}
@keyframes bannerIn{from{transform:translateY(-100%)}}
#toasts{position:fixed; bottom:14px; left:0; right:0; z-index:60; display:flex; flex-direction:column;
  align-items:center; gap:6px; pointer-events:none}
.toast{background:rgba(16,10,24,.95); border:1px solid rgba(255,255,255,.14); color:#f4eef7; font-size:14px; font-weight:600;
  padding:10px 16px; border-radius:14px; max-width:92%; text-align:center; animation:toastIn .3s ease;
  box-shadow:0 4px 18px rgba(0,0,0,.6)}
@keyframes toastIn{from{transform:translateY(20px); opacity:0}}
#floaters{position:fixed; inset:0; z-index:70; pointer-events:none; overflow:hidden}
.floater{position:absolute; font-weight:800; font-size:19px; text-shadow:0 2px 8px rgba(0,0,0,.8);
  animation:floatUp 1.3s ease-out forwards; white-space:nowrap}
@keyframes floatUp{0%{transform:translateY(0) scale(.7); opacity:0} 12%{opacity:1; transform:translateY(-8px) scale(1.12)}
  100%{transform:translateY(-90px) scale(1); opacity:0}}
#confetti{position:fixed; inset:0; z-index:80; pointer-events:none}

/* ---------- Death screen ---------- */
#scr-death{justify-content:center; text-align:center; min-height:100dvh}
.tomb{font-size:60px; margin-bottom:8px; opacity:.9}
#deathName{font-size:25px; font-weight:800; letter-spacing:1px}
#deathCause{color:#b9a8c9; margin:6px 0 14px; font-size:15px; padding:0 10px}
.hl-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; margin-bottom:12px}
.hl{background:rgba(20,13,30,.72); border:1px solid rgba(255,255,255,.09); border-radius:14px; padding:10px}
.hl .k{font-size:10px; color:#8d7ba3; text-transform:uppercase; letter-spacing:2px}
.hl .v{font-size:18px; font-weight:800; margin-top:3px}
#legacyScore{font-size:42px; font-weight:900; color:#f5c86e; text-shadow:0 0 24px rgba(245,200,110,.35); margin:4px 0}
.ach-line{font-size:13px; color:#b9a8c9; margin:8px 0; padding:0 12px; line-height:1.6}

</style>
</head>
<body>
<div id="stage">
  <div id="shakeWrap">

    <!-- TITLE -->
    <div id="scr-title" class="screen">
      <div class="stage-lights"><span>🎤</span><span>🎸</span><span>🥁</span></div>
      <div class="logo">ROCKSTAR<br>LIFE</div>
      <div class="logo-sub">live fast &middot; play loud</div>
      <button class="btn gold" id="btnNew">🎸 NEW LIFE</button>
      <button class="btn cyan hidden" id="btnContinue">▶ CONTINUE</button>
      <div class="best-line hidden" id="bestLine"></div>
      <div class="title-foot">every choice matters &middot; every life is a song</div>
    </div>

    <!-- GAME -->
    <div id="scr-game" class="screen hidden">
      <div id="hudTop">
        <canvas id="avatar" width="192" height="192"></canvas>
        <div>
          <div id="hudName">—</div>
          <div id="hudMeta">—</div>
          <div id="hudTier">—</div>
        </div>
      </div>
      <div id="stats">
        <div class="stat" id="row-looks"><div class="slabel"><span>😍 Looks</span><b id="v-looks">0</b></div><div class="bar"><div class="fill" id="b-looks"></div></div></div>
        <div class="stat" id="row-talent"><div class="slabel"><span>🎵 Talent</span><b id="v-talent">0</b></div><div class="bar"><div class="fill" id="b-talent"></div></div></div>
        <div class="stat" id="row-fame"><div class="slabel"><span>⭐ Fame</span><b id="v-fame">0</b></div><div class="bar"><div class="fill" id="b-fame"></div></div></div>
        <div class="stat" id="row-health"><div class="slabel"><span>❤️ Health</span><b id="v-health">0</b></div><div class="bar"><div class="fill" id="b-health"></div></div></div>
        <div class="stat" id="row-happiness"><div class="slabel"><span>😊 Happiness</span><b id="v-happiness">0</b></div><div class="bar"><div class="fill" id="b-happiness"></div></div></div>
        <div class="stat" id="row-addiction"><div class="slabel"><span>💉 Addiction</span><b id="v-addiction">0</b></div><div class="bar"><div class="fill" id="b-addiction"></div></div></div>
        <div class="stat" id="row-notoriety"><div class="slabel"><span>😈 Notoriety</span><b id="v-notoriety">0</b></div><div class="bar"><div class="fill" id="b-notoriety"></div></div></div>
        <div id="moneyRow"><span>💰 NET WORTH</span><span id="v-money">$0</span></div>
      </div>
      <button class="btn" id="ageBtn">🎂 AGE +1</button>
      <div id="menuGrid">
        <button class="menu-btn" data-menu="career"><span class="ic">🎤</span>Career</button>
        <button class="menu-btn" data-menu="activities"><span class="ic">🎉</span>Activities</button>
        <button class="menu-btn" data-menu="love"><span class="ic">💘</span>Love</button>
        <button class="menu-btn" data-menu="health"><span class="ic">🏥</span>Health</button>
        <button class="menu-btn" data-menu="crime"><span class="ic">🚔</span>Crime</button>
        <button class="menu-btn" data-menu="life"><span class="ic">📖</span>My Life</button>
        <button class="menu-btn" data-menu="assets"><span class="ic">💰</span>Assets</button>
      </div>
    </div>

    <!-- DEATH -->
    <div id="scr-death" class="screen hidden">
      <div class="tomb">🪦</div>
      <div id="deathName">—</div>
      <div id="deathCause">—</div>
      <div class="hl-grid" id="deathHL"></div>
      <div style="font-size:14px;color:#d9a7e8;letter-spacing:2px">LEGACY SCORE</div>
      <div id="legacyScore">0</div>
      <div class="ach-line" id="deathAch"></div>
      <button class="btn gold" id="btnRebirth">🎸 START NEW LIFE</button>
      <button class="btn cyan hidden" id="btnKid">👶 CONTINUE AS KID</button>
    </div>

  </div>

  <div id="menuOverlay" class="hidden"><div id="menuPanel"></div></div>
  <div id="modalOverlay" class="hidden"><div id="modal"></div></div>
  <div id="banner" class="hidden"></div>
  <div id="toasts"></div>
  <div id="floaters"></div>
  <canvas id="confetti"></canvas>
</div>

<script>
"use strict";
/* ============================================================
   ROCKSTAR LIFE — a BitLife-style rockstar life simulator
   Single-file HTML5 game. Sections:
     1. HELPERS      2. DATA/CONSTANTS   3. STATE
     4. JUICE        5. SAVE             6. AVATAR
     7. UI RENDER    8. MODAL/EVENTS     9. AGE LOOP
     10. ACTIONS     11. DEATH           12. INIT
   ============================================================ */

/* ---------------- 1. HELPERS ---------------- */
function $(id){ return document.getElementById(id); }
function R(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }      // int inclusive
function RF(a,b){ return Math.random()*(b-a)+a; }                   // float
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function chance(p){ return Math.random() < p; }                     // p = 0..1
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function fmtMoney(n){
  var neg = n < 0, a = Math.abs(Math.round(n));
  var s;
  if(a >= 1e9) s = (a/1e9).toFixed(2)+"B";
  else if(a >= 1e6) s = (a/1e6).toFixed(2)+"M";
  else if(a >= 1e4) s = (a/1e3).toFixed(1)+"K";
  else s = a.toLocaleString("en-US");
  return (neg?"-$":"$")+s;
}

/* ---------------- 2. DATA ---------------- */
var FIRST_M=["Axl","Jimi","Ozzy","Slash","Mick","Dave","Kurt","Iggy","Lou","Vince","Nikki","Tommy","Ziggy","Rex","Dio","Lemmy","Joey","Dee","Bret","Steven","Axel","Corey"];
var FIRST_F=["Stevie","Joan","Debbie","Pat","Courtney","Janis","Grace","Hayley","Amy","Lita","Cher","Tina","Siouxsie","Kim","Shirley","Gwen","Alanis","Florence","Billie","Dua"];
var LAST=["Ryder","Starr","Wolfe","Blaze","Storm","Reed","Vance","Knox","Slade","Fury","Night","Cross","Ash","Raven","Steel","Fox","Wilde","Black","Stone","Riot","Jett","Vicious"];
var CITIES=["Los Angeles","Nashville","New York","London","Seattle","Austin","Detroit","Memphis","New Orleans","Las Vegas","Chicago","Miami"];
var SKINS=["#ffd9b3","#f1c27d","#e0ac69","#c68642","#8d5524","#5c3a1e"];
var HAIRS=["#111111","#3b2a1a","#7a4a1e","#c98a2b","#e8e8e8","#b3123f","#1e6fd9","#6a1fb3"];
var PERSONAS=["sweet","wild","chill","jealous","ambitious","mysterious"];

var TIERS=[
  {name:"Street Busker", icon:"🎸", gig:60,     gf:1,  need:0},
  {name:"Bar Covers",    icon:"🍺", gig:350,    gf:2,  need:10},
  {name:"Local Hero",    icon:"🌟", gig:1800,   gf:4,  need:25},
  {name:"Signed Artist", icon:"💿", gig:9000,   gf:8,  need:45},
  {name:"Rising Star",   icon:"🚀", gig:45000,  gf:14, need:65},
  {name:"Superstar",     icon:"👑", gig:220000, gf:22, need:80},
  {name:"Global Icon",   icon:"🌍", gig:1100000,gf:32, need:92},
  {name:"Legend",        icon:"⚡", gig:5500000,gf:45, need:98}
];
function tierForFame(f){
  var t=0;
  for(var i=0;i<TIERS.length;i++){ if(f>=TIERS[i].need) t=i; }
  return t;
}

/* --- assets & businesses catalogs --- */
var ASSETCAT=[
 {name:"Used Sedan",icon:"🚗",cost:15000},
 {name:"Sports Car",icon:"🏎️",cost:200000},
 {name:"Supercar",icon:"🚀",cost:1200000},
 {name:"Tour Bus",icon:"🚌",cost:500000},
 {name:"Studio Apartment",icon:"🏢",cost:80000},
 {name:"Suburban House",icon:"🏠",cost:350000},
 {name:"Mansion",icon:"🏰",cost:2500000},
 {name:"Private Jet",icon:"🛩️",cost:8000000}
];
var BIZCAT=[
 {name:"Merch Line",icon:"👕",cost:50000},
 {name:"Clothing Brand",icon:"👗",cost:300000},
 {name:"Indie Label",icon:"💿",cost:500000,minTier:5},
 {name:"Restaurant Chain",icon:"🍔",cost:1000000}
];
var BAND_ADJ=["Velvet","Neon","Midnight","Electric","Crimson","Static","Wild","Cosmic"];
var BAND_NOUN=["Riots","Wolves","Rebels","Hearts","Parade","Ghosts","Kings","Static"];
function assetValue(){ return S.assets.reduce(function(s,a){return s+a.value;},0); }
function bizValue(){ return (S.biz||[]).reduce(function(s,b){return s+b.value;},0); }
function netWorth(){ return Math.round(S.stats.money+assetValue()+bizValue()); }

var SAVE_KEY="rockstarLifeSaveV1", BEST_KEY="rockstarLifeBestV1";

/* ---------------- 3. STATE ---------------- */
var S=null;
function newLife(){
  var female = chance(0.5);
  S={
    name:(female?pick(FIRST_F):pick(FIRST_M))+" "+pick(LAST),
    gender:female?"F":"M", city:pick(CITIES),
    age:0, skin:pick(SKINS), hair:pick(HAIRS),
    stats:{looks:R(20,90), talent:R(20,90), fame:0, health:R(70,100), happiness:R(50,90),
           money:0, addiction:0, notoriety:0},
    tier:0, signed:false, advance:0, albumsOwed:0, singles:0, albums:0, tours:0,
    partner:null, side:[], kids:[], spouses:0, divorces:0,
    prison:0, prisonTotal:0, record:false, alimony:0, alimonyAmt:0,
    ach:[], peakFame:0, peakTier:0, peakWorth:0,
    assets:[], biz:[], band:null, rival:null, awardYear:-1,
    alive:true, cause:"", rel:0
  };
  toast("🍼 "+S.name+" is born in "+S.city+"!", "🎸");
  confetti(40);
  saveGame();
}
function achieve(id,label){
  if(S.ach.indexOf(id)===-1){ S.ach.push(id); toast("🏆 Achievement: "+label,"🏆"); confetti(60); }
}
/* ---------------- 4. JUICE ----------------
   Every stat change in the game flows through delta()/moneyDelta()
   so a floater number ALWAYS pops. */
var POS_COLORS={looks:"#ff9de2",talent:"#00e5ff",fame:"#f5c86e",health:"#8fe3a8",
  happiness:"#ffb347",money:"#7cff9e",addiction:"#ff4d4d",notoriety:"#c77dff"};
function floaterAt(x,y,text,color,size){
  var f=document.createElement("div");
  f.className="floater"; f.textContent=text;
  f.style.left=x+"px"; f.style.top=y+"px";
  f.style.color=color||"#fff"; f.style.fontSize=(size||20)+"px";
  $("floaters").appendChild(f);
  setTimeout(function(){ f.remove(); },1350);
}
function juiceAt(elm,text,color,size){
  if(!elm) return;
  var r=elm.getBoundingClientRect();
  floaterAt(r.left+r.width/2-10, r.top-6, text, color, size);
}
/* delta: change a 0-100 stat, clamp, pop a floater over its bar */
function delta(stat,amt,opts){
  opts=opts||{};
  if(!S||!S.alive) return S?S.stats[stat]:0;
  var oldT=S.tier;
  S.stats[stat]=clamp(Math.round(S.stats[stat]+amt),0,100);
  if(!opts.silent){
    var row=$("row-"+stat);
    var txt=(amt>0?"+":"")+Math.round(amt);
    var col=amt>0?(POS_COLORS[stat]||"#fff"):"#ff6b6b";
    juiceAt(row,txt,col,amt>0?22:20);
  }
  if(stat==="fame"){
    if(S.stats.fame>S.peakFame) S.peakFame=S.stats.fame;
    var nt=tierForFame(S.stats.fame);
    if(nt>S.tier){ S.tier=nt;
      if(S.tier>S.peakTier) S.peakTier=S.tier;
      showBanner(TIERS[nt].icon+" "+TIERS[nt].name.toUpperCase(), "career tier up!");
      confetti(90);
      if(nt>=3) achieve("tier"+nt, TIERS[nt].name);
    }
  }
  renderStats();
  return S.stats[stat];
}
function moneyDelta(amt,label){
  if(!S||!S.alive) return S?S.stats.money:0;
  S.stats.money=Math.round(S.stats.money+amt);
  var txt=(amt>0?"+":"")+fmtMoney(amt);
  juiceAt($("moneyRow"),txt,amt>0?"#f5c86e":"#ff6b6b",22);
  if(label) toast(label, amt>0?"💰":"💸");
  renderStats();
  return S.stats.money;
}
/* confetti particle burst */
var confP=[], confRunning=false;
function confetti(n){
  var c=$("confetti"); c.width=innerWidth; c.height=innerHeight;
  var colors=["#ff2fd6","#ffe600","#00e5ff","#7cff00","#ff7b00","#ffffff"];
  for(var i=0;i<(n||60);i++){
    confP.push({x:innerWidth/2+RF(-60,60), y:innerHeight*0.35,
      vx:RF(-7,7), vy:RF(-11,-3), s:RF(4,9), r:RF(0,6.3), vr:RF(-.3,.3),
      col:pick(colors), life:RF(50,110)});
  }
  if(!confRunning){ confRunning=true; requestAnimationFrame(confTick); }
}
function confTick(){
  var c=$("confetti"), x=c.getContext("2d");
  x.clearRect(0,0,c.width,c.height);
  confP=confP.filter(function(p){ return p.life>0 && p.y<c.height+20; });
  for(var i=0;i<confP.length;i++){ var p=confP[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.28; p.r+=p.vr; p.life--;
    x.save(); x.translate(p.x,p.y); x.rotate(p.r);
    x.fillStyle=p.col; x.globalAlpha=Math.min(1,p.life/40);
    x.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); x.restore();
  }
  if(confP.length){ requestAnimationFrame(confTick); }
  else { confRunning=false; x.clearRect(0,0,c.width,c.height); }
}
function shakeIt(){
  var w=$("shakeWrap");
  w.classList.remove("shaking"); void w.offsetWidth; w.classList.add("shaking");
  setTimeout(function(){ w.classList.remove("shaking"); },500);
}
var bannerTimer=null;
function showBanner(title,sub){
  var b=$("banner");
  b.innerHTML=title+(sub?'<span class="bsub">'+sub+'</span>':"");
  b.classList.remove("hidden");
  clearTimeout(bannerTimer);
  bannerTimer=setTimeout(function(){ b.classList.add("hidden"); },2400);
}
function toast(msg,icon){
  var t=document.createElement("div");
  t.className="toast"; t.textContent=(icon?icon+" ":"")+msg;
  $("toasts").appendChild(t);
  while($("toasts").children.length>4) $("toasts").firstChild.remove();
  setTimeout(function(){ t.style.opacity="0"; t.style.transition="opacity .4s";
    setTimeout(function(){ t.remove(); },400); },2600);
}

/* ---------------- 5. SAVE ---------------- */
function saveGame(){
  if(!S||!S.alive) return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function loadGame(){
  try{
    var raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    S=JSON.parse(raw);
    /* v1.1 migration: bail out minors who went into debt before the expense fix */
    if(S&&S.age<18&&S.stats&&S.stats.money<0){ S.stats.money=0; S._bailed=true; }
    /* v1.4 migration: new systems on old saves */
    if(S){ if(!S.assets)S.assets=[]; if(!S.biz)S.biz=[];
      if(S.band===undefined)S.band=null; if(S.rival===undefined)S.rival=null;
      if(S.awardYear===undefined)S.awardYear=-1; }
    return !!(S&&S.alive!==undefined);
  }catch(e){ return false; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function getBest(){ try{ return parseInt(localStorage.getItem(BEST_KEY)||"0",10)||0; }catch(e){ return 0; } }
function setBest(v){ try{ localStorage.setItem(BEST_KEY,String(v)); }catch(e){} }

/* ---------------- 6. AVATAR (procedural, evolves with fame) ---------------- */
function drawAvatar(){
  var c=$("avatar"); if(!c) return;
  var x=c.getContext("2d"), W=c.width, H=c.height;
  var fame=S?S.stats.fame:0, tier=S?S.tier:0;
  /* stage background */
  var g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#3d0057"); g.addColorStop(1,"#12001f");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  /* spotlight beams */
  x.globalAlpha=0.25;
  var cols=["#ff2fd6","#00e5ff","#ffe600"];
  for(var i=0;i<3;i++){
    x.fillStyle=cols[i];
    x.beginPath();
    x.moveTo(W*(0.2+i*0.3),0); x.lineTo(W*(0.32+i*0.3),0);
    x.lineTo(W*(0.55+i*0.18),H); x.lineTo(W*(0.2+i*0.18),H);
    x.closePath(); x.fill();
  }
  x.globalAlpha=1;
  var cx=W/2, hy=H*0.42;
  var hairH=10+fame*0.5;                       /* hair grows with fame */
  /* body / jacket */
  var jacket=["#333","#333","#5a2a82","#7b1e5e","#b3123f","#8a6d00","#d4af37","#ffd700"][tier]||"#333";
  x.fillStyle=jacket;
  x.beginPath(); x.ellipse(cx,H*0.98,52,44,0,Math.PI,0); x.fill();
  x.fillStyle="rgba(255,255,255,.15)"; x.fillRect(cx-52,H*0.78,104,6);
  /* gold chains at superstar+ */
  if(tier>=5){
    x.strokeStyle="#ffd700"; x.lineWidth=5;
    for(var ch=0;ch<3;ch++){
      x.beginPath(); x.arc(cx,H*0.72,26+ch*9,0.25*Math.PI,0.75*Math.PI); x.stroke();
    }
  }
  /* neck + head */
  x.fillStyle=S?S.skin:"#f1c27d";
  x.fillRect(cx-11,H*0.58,22,16);
  x.beginPath(); x.arc(cx,hy,30,0,6.3); x.fill();
  /* hair */
  x.fillStyle=S?S.hair:"#111";
  x.beginPath(); x.ellipse(cx,hy-hairH*0.45,32,14+hairH*0.55,0,Math.PI,0); x.fill();
  x.fillRect(cx-32,hy-hairH,64,hairH*0.6);
  /* eyes or sunglasses at superstar+ */
  if(tier>=5){
    x.fillStyle="#0a0a0a";
    x.beginPath(); x.ellipse(cx-13,hy+2,11,8,0,0,6.3); x.fill();
    x.beginPath(); x.ellipse(cx+13,hy+2,11,8,0,0,6.3); x.fill();
    x.fillRect(cx-13,hy-2,26,4);
    x.fillStyle="rgba(255,255,255,.5)"; x.fillRect(cx-18,hy-2,6,4); x.fillRect(cx+8,hy-2,6,4);
  } else {
    x.fillStyle="#1a1a1a";
    x.beginPath(); x.arc(cx-11,hy+3,3.4,0,6.3); x.fill();
    x.beginPath(); x.arc(cx+11,hy+3,3.4,0,6.3); x.fill();
  }
  /* grin */
  x.strokeStyle="#5c2015"; x.lineWidth=3;
  x.beginPath(); x.arc(cx,hy+10,10,0.15*Math.PI,0.85*Math.PI); x.stroke();
  /* mic at signed+ */
  if(tier>=3){
    x.strokeStyle="#888"; x.lineWidth=5;
    x.beginPath(); x.moveTo(cx+44,H*0.95); x.lineTo(cx+30,hy+16); x.stroke();
    x.fillStyle="#222"; x.beginPath(); x.arc(cx+29,hy+13,10,0,6.3); x.fill();
    x.fillStyle="#555"; x.beginPath(); x.arc(cx+29,hy+13,6,0,6.3); x.fill();
  }
  /* crowd hands at bottom */
  x.fillStyle="rgba(0,0,0,.55)";
  for(var hd=0;hd<7;hd++){
    var hx=hd*(W/6)+8;
    x.fillRect(hx,H-26,10,26);
    x.beginPath(); x.arc(hx+5,H-28,7,0,6.3); x.fill();
  }
}
/* ---------------- 7. UI RENDER ---------------- */
function showScreen(name){
  ["title","game","death"].forEach(function(s){
    $("scr-"+s).classList.toggle("hidden", s!==name);
  });
  window.scrollTo(0,0);
}
function renderStats(){
  if(!S) return;
  var st=S.stats;
  [["looks"],["talent"],["fame"],["health"],["happiness"],["addiction"],["notoriety"]].forEach(function(k){
    k=k[0];
    $("v-"+k).textContent=Math.round(st[k]);
    var bar=$("b-"+k);
    bar.style.width=clamp(st[k],0,100)+"%";
    bar.className="fill"+((k==="health"||k==="happiness")&&st[k]<25?" bad":(st[k]<35&&(k==="addiction"||k==="notoriety")?"":"")) ;
    if(k==="addiction"||k==="notoriety") bar.className="fill"+(st[k]>60?" bad":st[k]>30?" warn":"");
    if((k==="health"||k==="happiness")&&st[k]<35) bar.className="fill bad";
    else if((k==="health"||k==="happiness")&&st[k]<60) bar.className="fill warn";
  });
  var nw=netWorth();
  $("v-money").textContent=fmtMoney(nw);
  $("v-money").style.color=nw<0?"#ff6b6b":"#7cff9e";
  if(nw>S.peakWorth) S.peakWorth=nw;
}
function renderAll(){
  if(!S) return;
  $("hudName").textContent=S.name;
  var meta="🎂 "+S.age+" · "+(S.gender==="F"?"👩":"👨")+" · 📍 "+S.city;
  if(S.prison>0) meta+=" · 🔒 PRISON ("+S.prison+"y left)";
  if(S.record) meta+=" · ⚠️ record";
  $("hudMeta").textContent=meta;
  var T=TIERS[S.tier];
  $("hudTier").textContent=T.icon+" "+T.name+(S.signed?" · 💿 signed":"");
  $("ageBtn").innerHTML=S.prison>0?"🔒 SERVE YEAR":"🎂 AGE +1";
  renderStats();
  drawAvatar();
}

var MENU_TITLES={career:"🎤 Career",activities:"🎉 Activities",love:"💘 Love Life",
  health:"🏥 Health",crime:"🚔 Crime",life:"📖 My Life",drugs:"💊 Drugs",prison:"🔒 Prison Yard",
  assets:"💰 Assets",band:"🤘 Band"};
function openMenu(kind){
  if(!S||!S.alive) return;
  if(S.prison>0 && kind!=="prison" && kind!=="life"){
    toast("You are locked up. Only the yard and your memories.","🔒"); return;
  }
  var items=buildMenu(kind);
  var title=MENU_TITLES[kind];
  if(S.age<=7&&kind==="career") title="🎸 Little Rockstar";
  if(S.age<=7&&kind==="activities") title="🏠 Around the House";
  var h='<div class="menu-head"><h2>'+title+'</h2>'+
        '<button class="xbtn" onclick="closeMenu()">✕</button></div>';
  if(kind==="love") h+=loveSummary();
  if(kind==="life") h+=lifeSummary();
  if(kind==="band") h+=bandSummary();
  if(kind==="assets") h+=assetSummary();
  if(kind==="prison") h+='<div class="kv">🔒 '+S.prison+' years left on your sentence. Keep your head down… or don\'t.</div>';
  items.forEach(function(it){
    if(it.head){ h+='<div class="kv" style="text-align:center;font-weight:800;letter-spacing:2px">'+it.label+'</div>'; return; }
    var locked=it.min&&S.age<it.min;
    h+='<button class="btn small '+it.cls+(locked?" locked":"")+'"'
      +(locked?"":' onclick="A(\''+it.act+'\')"')
      +'>'+(locked?"🔒 ":it.icon+" ")+it.label
      +'<span class="sub">'+(locked?("unlocks at age "+it.min):(it.sub||""))+'</span></button>';
  });
  $("menuPanel").innerHTML=h;
  $("menuOverlay").classList.remove("hidden");
}
function closeMenu(){ $("menuOverlay").classList.add("hidden"); }

  moneyDelta(-c.cost,"💰 Bought "+c.name);

function sellAsset(i){

  moneyDelta(v,"💰 Sold "+a.name);
}
function buyBiz(i){

function sellBiz(i){

function newMember(role){

    skill:R(40,80), ego:R(20,60), happy:R(50,80)};

function formBand(){

  ["Drums","Bass","Guitar"].forEach(function(r){ B.members.push(newMember(r)); });

function breakupBand(){
  if(!S.band) return;
  var n=S.band.name; S.band=null;
  delta("fame",-5);
  showBanner("💔 BAND BREAKUP",n+" is no more");
  toast("💔 "+n+" broke up. Creative differences.","💔");

/* band member OD death (used by the band OD event) */
function odDeath(){
  var B=S.band; if(!B) return "The band is already gone.";
  var i=B.members.indexOf(_bod); if(i>=0) B.members.splice(i,1);
  B.chem=clamp(B.chem-25,0,100);
  delta("fame",5); shakeIt();
  toast("📰 Tragedy press: the world mourns "+_bod.name+".","📰");
  if(B.members.length===0||B.chem<=0){
    breakupBand();

/* ---------------- CONTINUE AS YOUR KID ---------------- */
function continueAsKid(idx){
  var old=S, n=old.kids.length, ei=idx||0;
  var heir=old.kids[ei];
  var oldPeakWorth=old.peakWorth;
  newLife();   /* fresh state, then override with the inheritance */
  S.name=heir.name;
  S.age=heir.age;
  S.stats.money=Math.floor(old.stats.money/n);
  S.stats.looks=R(30,90);
  S.stats.talent=clamp(R(30,90)+(old.peakTier>=5?10:0),0,100);
  S.assets=old.assets.filter(function(a,i){ return i%n===ei; });
  S.biz=(old.biz||[]).filter(function(b,i){ return i%n===ei; });
  S.stats.fame=Math.round(old.peakFame*0.3);
  if(S.stats.fame>S.peakFame) S.peakFame=S.stats.fame;
  S.tier=tierForFame(S.stats.fame);
  if(S.tier>S.peakTier) S.peakTier=S.tier;
  S.peakWorth=Math.max(0,netWorth(),Math.floor(oldPeakWorth/n));
  toast("👶 Nepo baby! You inherit the name and a head start.","🌟");
  confetti(90);
  showScreen("game"); renderAll(); saveGame();
}

/* eventChoice: show a yearly event with 2-3 choices */

/* ---------------- 9. AGE LOOP / EVENTS / PRISON ---------------- */
function modalOpen(){ return !$("modalOverlay").classList.contains("hidden"); }

function onAge(){
  if(!S||!S.alive||modalOpen()) return;
  closeMenu();
  if(S.prison>0){ serveYear(); return; }
  S.age++;
  /* --- aging --- */
  if(S.age>40) delta("looks",-R(1,3),{silent:true});
  if(S.age>60) delta("looks",-R(1,3),{silent:true});
  if(S.age>40) delta("health",-R(1,2),{silent:true});
  if(S.age>60) delta("health",-R(2,4),{silent:true});
  if(S.age>55&&S.stats.fame>0) delta("fame",-R(1,3),{silent:true});
  if(S.stats.happiness>60) delta("happiness",-2,{silent:true});
  /* --- addiction damage --- */
  var ad=S.stats.addiction;
  if(ad>=70){
    delta("health",-R(4,10)); delta("happiness",-6);
    if(chance(0.07)){ overdose(); return; }
  } else if(ad>=40){ delta("health",-R(2,6)); }
  /* --- income: royalties --- */
  if(S.tier>=1&&(S.albums>0||S.singles>0)){
    var roy=Math.round((S.albums*2500+S.singles*400)*(1+S.stats.fame/40));
    moneyDelta(roy,"💿 Royalty check");
  }
  /* --- expenses (minors live with their parents — no bills) --- */
  if(S.age>=18){
    var living=4000+Math.round(S.stats.fame*120)+S.kids.length*8000+(S.partner?2500:0);
    moneyDelta(-living,"🧾 Living expenses");
  }
  if(S.alimony>0){ moneyDelta(-S.alimonyAmt,"⚖️ Alimony"); S.alimony--; }
  if(S.stats.money<0){ delta("happiness",-5); toast("📉 You are in debt!","⚠️"); }
  /* --- kids grow --- */
  S.kids.forEach(function(k){ k.age++; });
  /* --- partner drift --- */
  if(S.partner){
    S.partner.rel=clamp(S.partner.rel-R(2,6),0,100);
    if(S.partner.rel<=0){
      var ex=S.partner; S.partner=null;
      toast("💔 "+ex.name+" left you. Neglect kills love.","💔");
    }
  }
  /* --- businesses: yearly profit/loss --- */
  if(S.biz&&S.biz.length){
    S.biz.forEach(function(b){
      var p=Math.round(b.value*RF(-0.05,0.25));
      moneyDelta(p,(p>=0?"📈 ":"📉 ")+b.name+": "+fmtMoney(p));
      if(b.name==="Indie Label"&&chance(0.25)){
        var hp=Math.round(b.value*0.5);
        moneyDelta(hp,"💿 Label hit!");
        delta("fame",4); confetti(60);
        toast("💿 Your label's artist dropped a HIT!","🔥");
      }
    });
  }
  /* --- band: ego drift, morale drift, breakup check --- */
  if(S.band){
    var BB=S.band;
    BB.members.forEach(function(m){
      m.ego=clamp(Math.round(m.ego+(S.stats.fame>50?R(1,3):R(0,1))),0,100);
      m.happy=clamp(m.happy+R(-4,2),0,100);
    });
    BB.chem=clamp(Math.round(BB.chem+R(-3,1)),0,100);
    if(BB.chem<=0) breakupBand();
  }
  /* --- rivalry heat decay --- */
  if(S.rival){
    S.rival.heat-=10;
    if(S.rival.heat<=0){
      toast("🕊️ The beef with "+S.rival.name+" fizzled out.","🕊️");
      S.rival=null;
    }
  }
  /* --- side-piece exposure --- */
  if(S.side.length>0&&S.partner&&chance(0.08+0.07*S.side.length)){
    exposed(); renderAll(); saveGame(); return;
  }
  if(deathCheck()) return;
  renderAll(); saveGame();
  var ev=pickEvent();
  if(ev) eventChoice(ev);
}
function pickEvent(){
  var pool=EVENTS.filter(function(e){ try{return e.cond();}catch(err){return false;} });
  if(!pool.length) return null;
  var tot=0, i;
  pool.forEach(function(e){ tot+=e.wt; });
  var roll=Math.random()*tot;
  for(i=0;i<pool.length;i++){ roll-=pool[i].wt; if(roll<=0) return pool[i]; }
  return pool[pool.length-1];
}

/* overdose — can kill */
function overdose(){
  shakeIt();
  if(chance(0.45)){
    delta("health",-R(20,35)); delta("happiness",-12);
    delta("addiction",-R(5,15));
    toast("🚨 You OD'd — paramedics brought you back!","🏥");
    achieve("od","Cheated Death");
    renderAll(); saveGame();
  } else {
    die("💀 Overdose. The drugs finally won at age "+S.age+".");
  }
}
function deathCheck(){
  if(S.stats.health<=0){ die("💔 Your body gave out after years of abuse. You were "+S.age+"."); return true; }
  if(S.age>70&&chance((S.age-70)*0.045)){ die("🕊️ Died peacefully in your sleep at "+S.age+"."); return true; }
  if(S.age>=112){ die("🕊️ Lived to "+S.age+" — time simply ran out."); return true; }
  return false;
}
function checkDead(){
  if(S&&S.alive&&S.stats.health<=0) die("💔 Your body gave out. You were "+S.age+".");
}

/* ---------------- ARREST / TRIAL ---------------- */
function busted(crimeName){
  shakeIt();
  delta("notoriety",R(5,12));
  delta("happiness",-R(5,12));
  var yrs=clamp(R(1,5)+(S.record?2:0)+(S.stats.notoriety>50?2:0),1,10);
  openModal('<h2>🚔 BUSTED!</h2><div class="mtext">Caught red-handed: <b>'+crimeName+
    '</b>.<br>The trial is next week. How do you plead?</div>'+
    '<button class="btn gold small" id="tLaw">⚖️ Hire Hotshot Lawyer<span class="sub">'+fmtMoney(50000)+' · may beat the case</span></button>'+
    '<button class="btn ghost small" id="tPub">🧑‍⚖️ Public Defender<span class="sub">free · face the music</span></button>');
  $("tLaw").onclick=function(){
    if(S.stats.money<50000){ toast("You cannot afford the lawyer!","⚠️"); return; }
    moneyDelta(-50000,"⚖️ Legal fees");
    if(chance(0.55)){
      delta("notoriety",R(3,8));
      showResult("⚖️ ACQUITTED!","The jury loved you. Case dismissed — and the headlines made you <b>more</b> famous.",null);
      achieve("beatcase","Beat The Case");
    } else {
      startPrison(Math.max(1,yrs-2),"The lawyer got your sentence reduced, but you are still going away.");
    }
  };
  $("tPub").onclick=function(){
    startPrison(yrs,"The public defender barely tried. Guilty as charged.");
  };
}
function startPrison(yrs,note){
  S.prison=yrs; S.prisonTotal+=yrs; S.record=true;
  showBanner("🔒 "+yrs+" YEARS","sentenced!");
  showResult("🔒 PRISON",note+"<br><br>You will serve <b>"+yrs+" years</b>. Use the 🔒 Prison Yard menu and the SERVE YEAR button.",null);
  achieve("prison","Jailbird");
}

/* ---------------- PRISON YEARS ---------------- */
function serveYear(){
  S.age++;
  S.prison--;
  delta("health",-R(3,7)); delta("happiness",-R(5,10));
  delta("addiction",-R(10,20)); delta("fame",-R(2,5));
  moneyDelta(-500,"🍫 Commissary snacks");
  S.kids.forEach(function(k){ k.age++; });
  if(S.partner&&chance(0.15)){
    var ex=S.partner; S.partner=null;
    toast("💔 "+ex.name+" could not do the prison years. Gone.","💔");
  }
  if(deathCheck()) return;
  if(S.prison<=0){ release(); return; }
  renderAll(); saveGame();
  prisonEvent();
}

  }
}

/* ---------------- 10. ACTIONS ---------------- */
function needAge(n){ if(S.age<n){ toast("You must be at least "+n+" for that.","🔞"); return false; } return true; }
function needCash(n){ if(S.stats.money<n){ toast("You need "+fmtMoney(n)+".","💸"); return false; } return true; }
function afterAct(){ closeMenu(); renderAll(); saveGame(); checkDead(); }
function genPerson(){
  var f=chance(0.5);
  return {name:(f?pick(FIRST_F):pick(FIRST_M))+" "+pick(LAST),
    looks:R(20,100), fame:R(0,60), rel:50, spouse:false, engaged:false, persona:pick(PERSONAS)};
}
function A(name){
  if(!S||!S.alive||modalOpen()) return;
  if(S.prison>0&&name.indexOf("p_")!==0) return;
  if(name==="drugMenu"){ openMenu("drugs"); return; }
  if(name==="bandMenu"){ openMenu("band"); return; }
  if(name.indexOf("buyAsset")===0){ buyAsset(parseInt(name.slice(8),10)); afterAct(); return; }
  if(name.indexOf("sellAsset")===0){ sellAsset(parseInt(name.slice(9),10)); afterAct(); return; }
  if(name.indexOf("buyBiz")===0){ buyBiz(parseInt(name.slice(6),10)); afterAct(); return; }
  if(name.indexOf("sellBiz")===0){ sellBiz(parseInt(name.slice(7),10)); afterAct(); return; }
  var T=TIERS[S.tier];
  switch(name){
    /* ---- little rockstar (ages 1-7) ---- */
    case "k_pots": delta("talent",R(2,4)); delta("happiness",2);
      if(chance(0.2)){ delta("happiness",-3); toast("Mom says the pots are NOT drums. She is wrong.","🥁"); }
      else toast("Kitchen session! The neighbors are concerned.","🥁"); break;
    case "k_hum": delta("talent",R(1,3)); delta("happiness",1); break;
    case "k_air": delta("talent",R(1,3)); delta("happiness",R(2,4));
      toast("Air guitar solo in the living room. Flawless.","🎸"); break;
    case "k_draw": delta("talent",R(1,2)); delta("happiness",2);
      toast("You drew yourself headlining a stadium. Manifesting.","🖍️"); break;
    case "k_nap": delta("health",R(2,4)); delta("happiness",R(1,3)); break;
    case "k_toys": delta("happiness",R(3,6)); break;
    case "k_cartoons": delta("happiness",R(2,4)); break;
    case "k_snacks": delta("happiness",R(2,5)); delta("health",-R(1,3));
      toast("Cookies taste like victory.","🍪"); break;
    case "k_outside": delta("health",R(3,5)); delta("happiness",R(1,3)); break;
    case "k_hide": delta("happiness",R(2,4));
      if(chance(0.25)) toast("Nobody found you for an hour. Legendary hiding spot.","🫣"); break;
    case "k_tantrum": delta("happiness",R(4,8));
      if(chance(0.25)){ delta("happiness",-6); toast("GROUNDED. The tantrum backfired spectacularly.","😤"); }
      else toast("You screamed about nothing for 20 minutes. Cathartic.","😤"); break;
    /* ---- career ---- */
    case "practice": if(!needAge(10))break;
      delta("talent",S.stats.talent>80?R(1,3):R(2,6)); delta("happiness",-1); break;
    case "gig": if(!needAge(14))break;
      moneyDelta(gigPay(),"🎙️ Gig payday"); delta("fame",T.gf);
      delta("happiness",R(2,6)); delta("health",-R(1,3));
      if(chance(0.15)) delta("addiction",2); break;
    case "single": if(!needAge(14))break;
      if(!S.signed&&!needCash(10000))break;
      if(!S.signed) moneyDelta(-10000,"🎵 Studio time");
      S.singles++;
      if(hitRoll(58)){ delta("fame",R(8,16));
        moneyDelta(Math.round(R(30000,200000)*(1+S.tier*0.4)),"🎵 Single royalties");
        confetti(90); achieve("hit","Hit Single"); showBanner("🎵 HIT SINGLE!","climbing the charts");
      } else { delta("fame",R(1,4)); moneyDelta(R(2000,9000),"🎵 Single sales"); toast("The single flopped.","📉"); }
      break;
    case "album": if(!needAge(14))break;
      if(!S.signed&&!needCash(50000))break;
      if(!S.signed) moneyDelta(-50000,"💿 Studio time");
      S.albums++; if(S.signed&&S.albumsOwed>0)S.albumsOwed--;
      if(hitRoll(62)){ delta("fame",R(12,22));
        moneyDelta(Math.round(R(150000,800000)*(1+S.tier*0.4)),"💿 Album sales");
        confetti(120); achieve("album","Chart-Topper"); showBanner("💿 #1 ALBUM!","platinum baby");
      } else { delta("fame",R(2,6)); moneyDelta(R(10000,40000),"💿 Album sales"); toast("The album underperformed.","📉"); }
      break;
    case "tour": if(!needAge(16))break;
      moneyDelta(Math.round(gigPay()*10),"🚌 Tour revenue");
      delta("fame",R(10,18)); delta("health",-R(10,18));
      delta("happiness",-R(5,12)); delta("addiction",R(5,15));
      S.tours++; confetti(100);
      if(chance(0.2)){ delta("health",-10); toast("Tour bus fender-bender!","🚌"); }
      achieve("tour","Road Warrior"); break;
    case "labelInfo":
      openModal('<h2>📝 Label Deal</h2><div class="mtext">You owe Big Loud Records <b>'+S.albumsOwed+
        '</b> more album(s). They paid your studio costs — deliver the hits.</div><button class="btn" onclick="closeModal()">Got it</button>');
      break;
    /* ---- band ---- */
    case "formBand": if(!needAge(14))break;
      if(!needCash(5000))break;
      moneyDelta(-5000,"🤘 Band costs"); formBand(); break;
    case "b_jam":
      S.band.chem=clamp(S.band.chem+5,0,100);
      S.band.members.forEach(function(m){ m.happy=clamp(m.happy+3,0,100); });
      delta("happiness",3); toast("🎶 Tight jam. The band is gelling.","🤘"); break;
    case "b_fire": {
      if(!needCash(2000))break;
      moneyDelta(-2000,"🔥 Auditions");
      var B=S.band, qi=0, fi;
      for(fi=1;fi<B.members.length;fi++) if(B.members[fi].happy<B.members[qi].happy) qi=fi;
      var out=B.members[qi];
      B.members[qi]=newMember(out.role);
      B.chem=clamp(B.chem-10,0,100);
      toast("🔥 "+out.name+" is OUT. "+B.members[qi].name+" is in.","🤘");
      if(B.chem<=0) breakupBand();
      break; }
    /* ---- activities ---- */
    case "social":
      var flex=S.assets.some(function(a){return a.name==="Mansion"||a.name==="Private Jet";})?2:0;
      delta("fame",R(1,4)+Math.floor(S.tier/2)+flex);
      if(flex&&chance(0.5)) toast("📸 Flexing the lifestyle…","✨");
      if(chance(0.08)){ delta("fame",R(8,15)); confetti(50); toast("📱 Your post went VIRAL!","🔥"); }
      break;
    case "party": delta("happiness",R(8,15)); delta("addiction",R(5,12)); delta("health",-R(3,8));
      if(chance(0.10)){ busted("Trashing a hotel room"); }
      break;
    case "salon": if(!needCash(200))break;
      moneyDelta(-200,"💇 Salon"); delta("looks",R(2,6)); delta("happiness",3); break;
    case "surgery": if(!needAge(18)||!needCash(15000))break;
      moneyDelta(-15000,"🔪 Surgery");
      if(chance(0.08)){ shakeIt(); delta("looks",-R(10,20)); delta("health",-R(8,15)); toast("🔪 BOTCHED SURGERY!","🚨"); }
      else { delta("looks",R(8,15)); delta("happiness",5); toast("You look brand new.","✨"); }
      break;
    case "gala": if(!needCash(10000))break;
      moneyDelta(-10000,"🎗️ Donation"); delta("fame",R(3,7)); delta("happiness",R(4,8)); delta("notoriety",-3);
      confetti(40); break;
    /* ---- health ---- */
    case "gym": if(!needCash(50))break;
      moneyDelta(-50,"🏋️ Gym"); delta("health",R(3,7)); delta("looks",R(1,3)); break;
    case "checkup": if(!needCash(500))break;
      moneyDelta(-500,"🩺 Checkup"); delta("health",R(4,9)); break;
    case "meditate": delta("happiness",R(4,9)); delta("health",2); break;
    case "therapy": if(!needCash(300))break;
      moneyDelta(-300,"🛋️ Therapy"); delta("happiness",R(6,12)); delta("addiction",-R(3,8)); break;
    case "rehab": if(!needCash(25000))break;
      moneyDelta(-25000,"🏥 Rehab"); delta("addiction",-S.stats.addiction);
      delta("health",5); delta("happiness",-5); achieve("clean","Clean & Sober"); break;
    /* ---- drugs ---- */
    case "d_weed": if(!needAge(14))break;
      delta("happiness",R(4,8)); delta("addiction",R(3,6)); delta("health",-R(1,3)); break;
    case "d_coke": if(!needAge(16))break;
      delta("happiness",R(8,14)); delta("addiction",R(8,14)); delta("health",-R(4,8));
      if(chance(0.05)) busted("Cocaine possession"); break;
    case "d_heroin": if(!needAge(16))break;
      delta("happiness",R(12,20)); delta("addiction",R(15,22)); delta("health",-R(8,14));
      if(chance(0.12)){ overdose(); } else if(chance(0.06)) busted("Heroin possession");
      break;
    /* ---- love ---- */
    case "dating": if(!needAge(18))break; dating(); break;
    case "date": if(!needCash(500))break;
      moneyDelta(-500,"🍷 Date night"); S.partner.rel=clamp(S.partner.rel+R(5,12),0,100);
      delta("happiness",R(5,10)); juiceAt($("menuPanel"),"+"+Math.round(S.partner.rel)+"% ❤️","#ff9de2",18); break;
    case "propose": if(!needCash(2000))break;
      if(S.partner.rel<60){ toast(S.partner.name+" is not ready. (Need 60% relationship)","💔"); break; }
      moneyDelta(-2000,"💍 Engagement ring"); S.partner.engaged=true;
      confetti(80); toast("💍 "+S.partner.name+" said YES!","💒"); break;
    case "marry": {
      var cost=5000+Math.round(S.stats.fame*400);
      if(!needCash(cost))break;
      moneyDelta(-cost,"💒 Wedding"); S.partner.spouse=true; S.spouses++;
      delta("happiness",15); confetti(130); showBanner("💒 MARRIED!","to "+S.partner.name);
      achieve("married","Married"); break; }
    case "child":
      moneyDelta(-3000,"👶 Baby costs"); S.kids.push({name:pick(S.gender==="F"?FIRST_M:FIRST_F)+" "+S.name.split(" ")[1],age:0});
      delta("happiness",10); confetti(110); showBanner("👶 IT'S A BABY!",S.kids[S.kids.length-1].name+" is born");
      achieve("parent","Parent"); break;
    case "breakup": toast("💔 You dumped "+S.partner.name+".","💔");
      S.partner=null; delta("happiness",-R(8,15)); break;
    case "divorce": {
      var half=Math.round(S.stats.money*0.5);
      moneyDelta(-half,"⚖️ Divorce settlement"); S.divorces++;
      var av=assetValue()+bizValue();
      if(av>0) moneyDelta(-Math.round(av/2),"⚖️ Asset split");
      S.alimony=5; S.alimonyAmt=Math.max(5000,Math.round(S.peakWorth*0.02));
      toast("⚖️ Divorced. Half your money is gone.","💔");
      S.partner=null; delta("happiness",-15); delta("notoriety",5); break; }
    case "cheat":
      if(!chance(0.65)){ toast("No luck tonight.","🌙"); break; }
      var sp=genPerson(); S.side.push(sp);
      toast("😏 You met "+sp.name+"…","🌙");
      if(chance(0.30)) exposed();
      break;
    /* ---- crime ---- */
    case "c_fight": if(!needAge(12))break;
      if(chance(0.6)){ delta("notoriety",R(4,9)); delta("happiness",5); }
      else { delta("health",-R(8,15)); shakeIt(); }
      if(chance(0.25)) busted("Bar fight");
      break;
    case "c_heckler":
      if(S.stats.fame<15){ toast("Nobody knows you yet. No hecklers.","🎤"); break; }
      delta("notoriety",R(5,10)); delta("happiness",6);
      if(chance(0.25)) busted("Assaulting a heckler");
      break;
    case "c_steal":
      moneyDelta(Math.round(R(1000,9000)*(1+S.tier)),"💼 Stolen merch money");
      if(chance(0.30)) busted("Stealing from the venue");
      break;
    case "c_deal": if(!needAge(16))break;
      moneyDelta(R(5000,30000),"🌿 Drug money"); delta("addiction",R(5,10)); delta("notoriety",R(4,8));
      if(chance(0.35)) busted("Drug dealing");
      break;
    case "c_tax":
      if(S.stats.money<200000){ toast("You need "+fmtMoney(200000)+" to make evasion worthwhile.","🧾"); break; }
      moneyDelta(Math.round(S.stats.money*0.15),"🧾 'Saved' on taxes");
      if(chance(0.25)) busted("Tax evasion");
      break;
    /* ---- prison yard ---- */
    case "p_behave": S.goodTime=(S.goodTime||0)+1; delta("happiness",-2); toast("Good behavior noted. ("+S.goodTime+"✓)","😇"); break;
    case "p_fight": delta("health",-R(6,14)); delta("notoriety",R(5,10)); shakeIt(); break;
    case "p_gang": delta("notoriety",R(8,14)); delta("health",5); achieve("gang","Prison Gang"); break;
    case "p_parole": {
      var served=S.prisonTotal-S.prison;
      if(served<Math.ceil(S.prisonTotal/2)){ toast("Too early — serve half your sentence first.","🕊️"); break; }
      if(chance(0.35+(S.goodTime||0)*0.08)){ release(); }
      else { toast("Parole DENIED. See you next year.","🕊️"); delta("happiness",-8); }
      break; }
    case "p_escape":
      if(chance(0.22)){ delta("notoriety",15); showBanner("🏃 ESCAPED!","you are free… and wanted"); release(); }
      else { S.prison+=2; S.prisonTotal+=2; delta("health",-10); shakeIt(); toast("Caught! +2 years in solitary.","🔒"); }
      break;
  }
  afterAct();
}
function hitRoll(base){
  var b=base;
  if(S.band) b-=(S.band.chem-50)/5;   /* tight band = easier hits */
  return (S.stats.talent*0.6+S.stats.looks*0.2+S.stats.fame*0.2+R(0,20))>=b;
}
/* dating candidates */
var CANDS=[];
function dating(){
  CANDS=[genPerson(),genPerson(),genPerson()];
  var h='<h2>📱 HeartStrings</h2><div class="mtext">Three matches nearby…</div>';
  CANDS.forEach(function(c,i){
    h+='<button class="btn small" onclick="pickMate('+i+')">💘 '+c.name+
       '<span class="sub">looks '+Math.round(c.looks)+' · '+(c.fame>30?"semi-famous":"unknown")+' · '+c.persona+'</span></button>';
  });
  h+='<button class="btn ghost small" onclick="closeModal()">Nah, stay single</button>';
  openModal(h);
}
function pickMate(i){
  var c=CANDS[i];
  S.partner=c; closeModal();
  confetti(40); toast("💘 You are dating "+c.name+"!","💘");
}

/* ---------------- 11. DEATH & LEGACY ---------------- */
function legacyScore(){
  var worth=S.peakWorth>0?Math.round(Math.log10(S.peakWorth+1)*220):0;
  return Math.max(0,Math.round(S.peakFame*12+worth+S.kids.length*400+S.spouses*200+
    S.ach.length*300+S.age*5+S.tier*150-S.prisonTotal*50));
}
function die(cause){
  if(!S||!S.alive) return;
  S.alive=false; S.cause=cause;
  var sc=legacyScore(), best=getBest(), isBest=sc>best&&sc>0;
  if(isBest) setBest(sc);
  clearSave(); closeMenu(); closeModal();
  var T=TIERS[S.peakTier];
  $("deathName").textContent=S.name+" · age "+S.age;
  $("deathCause").textContent=cause;
  var hl=[
    ["Peak tier",T.icon+" "+T.name],["Peak net worth",fmtMoney(S.peakWorth)],
    ["Marriages",S.spouses],["Kids",S.kids.length],
    ["Prison time",S.prisonTotal+"y"],["Peak fame",Math.round(S.peakFame)]
  ];
  $("deathHL").innerHTML=hl.map(function(x){
    return '<div class="hl"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div>';
  }).join("");
  $("legacyScore").textContent=sc.toLocaleString("en-US");
  $("deathAch").textContent=S.ach.length?
    "🏆 "+S.ach.length+" achievement"+(S.ach.length>1?"s":"")+" unlocked — a life fully lived.":
    "No achievements. A quiet life, off the charts.";
  if(isBest) setTimeout(function(){ showBanner("👑 NEW BEST LEGACY!",sc.toLocaleString("en-US")+" points"); confetti(120); },400);
  var kb=$("btnKid");
  if(S.kids.length>0){
    var ei=0, ii;
    for(ii=1;ii<S.kids.length;ii++){ if(S.kids[ii].age>S.kids[ei].age) ei=ii; }
    kb.classList.remove("hidden");
    kb.textContent="👶 Continue as "+S.kids[ei].name;
    kb.onclick=(function(idx){ return function(){ continueAsKid(idx); }; })(ei);
  } else kb.classList.add("hidden");
  showScreen("death");
}

/* ---------------- 12. INIT ---------------- */
function hasLiveSave(){
  try{ var r=localStorage.getItem(SAVE_KEY); if(!r) return false;
    var s=JSON.parse(r); return !!(s&&s.alive); }catch(e){ return false; }
}
$("btnNew").onclick=function(){ newLife(); showScreen("game"); renderAll(); };
$("btnRebirth").onclick=function(){ newLife(); showScreen("game"); renderAll(); };
$("btnContinue").onclick=function(){
  if(loadGame()){ showScreen("game"); renderAll(); toast("Welcome back, rockstar.","🎸");
    if(S._bailed){ S._bailed=false; saveGame(); toast("👪 Your parents bailed you out of debt. Kids don't pay bills anymore.","💸"); } }
};
$("ageBtn").onclick=onAge;
var mb=document.querySelectorAll(".menu-btn");
for(var mi=0;mi<mb.length;mi++){
  (function(b){ b.onclick=function(){ openMenu(b.getAttribute("data-menu")); }; })(mb[mi]);
}
$("menuOverlay").addEventListener("click",function(e){ if(e.target===$("menuOverlay")) closeMenu(); });
(function initTitle(){
  $("btnContinue").classList.toggle("hidden",!hasLiveSave());
  var b=getBest();
  if(b>0){ $("bestLine").classList.remove("hidden");
    $("bestLine").textContent="👑 Best legacy: "+b.toLocaleString("en-US"); }
})();
</script>
